<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة المبتدأ والخبر</title>
<style>
:root{--t:#2596b4;--td:#16647a;--g:#86ae43;--gd:#587a22;--bg:#eef7f8;--ink:#17323a;--ok:#4f8a1f;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;position:relative;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%}
body::before{width:520px;height:520px;background:var(--t);opacity:.16;top:-200px;left:-160px}
body::after{width:420px;height:420px;background:var(--g);opacity:.2;bottom:-150px;right:-120px}
.wrap{max-width:560px;margin:0 auto;padding:14px}
.logos{display:flex;gap:10px;justify-content:center;align-items:stretch}
.logos div{background:#fff;border-radius:16px;padding:6px;flex:1;max-width:230px;box-shadow:0 2px 10px #2596b433;display:flex;align-items:center;justify-content:center}
.logos img{width:100%;max-height:120px;object-fit:contain}
h1{font-size:1.4rem;text-align:center;margin:14px 0 4px;color:var(--td)}
.sub{text-align:center;margin:0 0 12px;font-size:.9rem;color:var(--gd)}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 4px 18px #2596b42b;border-top:6px solid var(--g)}
.bar{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem;margin-bottom:8px}
.prog{height:10px;background:#dbeaee;border-radius:9px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--t),var(--g));transition:width .4s}
.q{font-size:1.2rem;font-weight:700;line-height:1.7;margin:0 0 14px}
.opt{display:block;width:100%;text-align:right;font:inherit;font-size:1.05rem;background:#f4fafb;border:2px solid #cfe3e8;border-radius:14px;padding:12px 14px;margin-bottom:10px;color:var(--ink);cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--t)}
.opt:focus-visible,.btn:focus-visible{outline:3px solid var(--td);outline-offset:2px}
.opt.ok{background:#e6f3d6;border-color:var(--ok)}
.opt.no{background:#fbe3df;border-color:var(--no);animation:sh .3s}
@keyframes sh{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{min-height:1.6em;font-weight:700;margin:4px 0 10px}
.btn{font:inherit;font-weight:700;font-size:1.05rem;background:var(--t);color:#fff;border:0;border-radius:14px;padding:12px 26px;cursor:pointer;min-height:48px}
.btn:hover{background:var(--td)}
.btn.g{background:var(--g)}.btn.g:hover{background:var(--gd)}
.c{text-align:center}
.big{font-size:3rem;margin:6px 0}
.stars{font-size:2.2rem;letter-spacing:6px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap">

<h1>تحدّي المبتدأ والخبر</h1>
<p class="sub">رفع المبتدأ والخبر بالعلامات الفرعية</p>

<div class="card c" id="start"><div class="big">📚</div>
<p>عشرة أسئلة: ست للاختيار وأربعة صح أو خطأ.<br>اجمع أكبر عدد من النقاط، والإجابات المتتالية تمنحك نقاطًا إضافية!</p>
<button class="btn" id="go">ابدأ اللعب</button></div>

<div class="card hide" id="game">
<div class="bar"><span id="num"></span><span id="pts"></span></div>
<div class="prog"><i id="pr"></i></div>
<p class="q" id="q"></p><div id="opts"></div>
<div class="fb" id="fb" aria-live="polite"></div>
<div class="c"><button class="btn g hide" id="next">التالي</button></div></div>

<div class="card hide c" id="end"><div class="stars" id="st"></div>
<h2 id="msg"></h2><p id="res"></p><button class="btn" id="again">العب من جديد</button></div>
</div>
<script>
const Q=[
{q:"في جملة «الطالبانِ مجتهدانِ»، علامة رفع المبتدأ هي:",o:["الضمة","الألف","الواو"],a:1,e:"الطالبان مثنى، فيُرفع بالألف."},
{q:"في جملة «المعلمونَ مخلصونَ»، علامة رفع المبتدأ هي:",o:["الألف","الواو","الضمة"],a:1,e:"المعلمون جمع مذكر سالم، فيُرفع بالواو."},
{q:"في جملة «المهندسانِ ماهرانِ»، علامة رفع الخبر هي:",o:["الألف","الواو","الضمة"],a:0,e:"ماهران خبر مثنى، فيُرفع بالألف."},
{q:"في جملة «المسلمونَ متعاونونَ»، علامة رفع الخبر هي:",o:["الضمة","الألف","الواو"],a:2,e:"متعاونون خبر جمع مذكر سالم، فيُرفع بالواو."},
{q:"أي الجمل الآتية رُفع فيها المبتدأ بالواو؟",o:["الطالبان حاضران.","المعلمون مبدعون.","الطالب مجتهد."],a:1,e:"المعلمون جمع مذكر سالم، فرُفع بالواو."},
{q:"علامة رفع المبتدأ والخبر في جملة «اللاعبانِ ماهرانِ» هي:",o:["الألف في كليهما","الواو في كليهما","الضمة في كليهما"],a:0,e:"كلاهما مثنى، فرُفعا بالألف."},
{q:"يُرفع المبتدأ والخبر بالألف إذا كانا مثنى.",o:["صح","خطأ"],a:0,e:"المثنى يُرفع بالألف."},
{q:"يُرفع جمع المذكر السالم بالواو.",o:["صح","خطأ"],a:0,e:"علامة رفعه الواو."},
{q:"في جملة «المهندسونَ بارعونَ»، علامة رفع الخبر الواو.",o:["صح","خطأ"],a:0,e:"بارعون خبر جمع مذكر سالم، فيُرفع بالواو."},
{q:"في جملة «الطالبتانِ متفوقتانِ»، علامة رفع المبتدأ الضمة.",o:["صح","خطأ"],a:1,e:"الطالبتان مثنى، فعلامة رفعه الألف."}];
const $=id=>document.getElementById(id);
let i,score,streak,done;
function show(id){["start","game","end"].forEach(x=>$(x).classList.toggle("hide",x!==id))}
function start(){i=0;score=0;streak=0;show("game");load()}
function load(){done=false;const d=Q[i];
$("num").textContent="السؤال "+(i+1)+" من "+Q.length;$("pts").textContent="⭐ "+score+(streak>1?"  🔥 "+streak:"");
$("pr").style.width=(i/Q.length*100)+"%";$("q").textContent=d.q;$("fb").textContent="";$("fb").style.color="";
$("next").classList.add("hide");$("next").textContent=i==Q.length-1?"النتيجة":"التالي";
const box=$("opts");box.innerHTML="";
d.o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(k,b);box.appendChild(b)})}
function pick(k,b){if(done)return;done=true;const d=Q[i],bs=[...$("opts").children];
bs.forEach(x=>x.disabled=true);bs[d.a].classList.add("ok");
if(k===d.a){streak++;const p=10+(streak>1?Math.min(streak-1,3)*2:0);score+=p;$("fb").style.color="var(--ok)";$("fb").textContent="أحسنت! +"+p+" نقطة. "+d.e}
else{streak=0;b.classList.add("no");$("fb").style.color="var(--no)";$("fb").textContent="إجابة غير صحيحة. "+d.e}
$("pts").textContent="⭐ "+score+(streak>1?"  🔥 "+streak:"");$("next").classList.remove("hide");$("next").focus()}
function nxt(){i++;if(i<Q.length)load();else finish()}
function finish(){show("end");const m=Q.length*10,r=score/m,s=r>=.9?3:r>=.6?2:1;
$("st").textContent="★".repeat(s)+"☆".repeat(3-s);
$("msg").textContent=s==3?"ممتاز! أنت بطل الإعراب":s==2?"جيد جدًا! واصل التقدم":"محاولة جيدة، جرّب مرة أخرى";
$("res").textContent="مجموع نقاطك: "+score}
$("go").onclick=start;$("again").onclick=start;$("next").onclick=nxt;
</script></body></html>
